[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "notebooks"

[tool.ruff]
line-length = 100
target-version = "py311"
# The Colab notebook is shell-heavy (!python …); the scripts it calls are linted.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["common"]
