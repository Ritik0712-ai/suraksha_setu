# Render Blueprint (docs/02 §9.2, docs/06 task 7.2) — the Node API and the Django AI service.
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once in the
# dashboard and never stored in git. Full steps, checks and rollback: docs/runbook.md §2.
#
# Both services build from the repo root because they read shared/constants.json.
# Plans: `free` while developing (sleeps after 15 min; UptimeRobot keeps it awake). Switch the
# API (and, if the budget allows, the AI service) to `starter` for the pilot and demo weeks
# (docs/06 task 7.6) — change `plan` here and re-sync the Blueprint.

services:
  - type: web
    name: suraksha-setu-api
    runtime: node
    region: singapore # closest Render region to India (docs/02 §9.2)
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --workspace apps/api --include-workspace-root=false
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: HUSKY
        value: "0" # no git hooks on the build machine
      - key: BCRYPT_COST
        value: "12"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: AI_INTERNAL_KEY
        generateValue: true # the AI service reads the same value below
      - key: MONGODB_URI # Atlas prod project, read/write app user (runbook §2.1)
        sync: false
      - key: CORS_ORIGINS # https://<app>.vercel.app[,https://<custom domain>]
        sync: false
      - key: PUBLIC_APP_URL # https://<app>.vercel.app (links in SOS SMS/email)
        sync: false
      - key: AI_BASE_URL # https://suraksha-setu-ai.onrender.com (no trailing slash)
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_FALLBACK_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_FALLBACK_PORT
        value: "587"
      - key: SMTP_FALLBACK_USER
        sync: false
      - key: SMTP_FALLBACK_PASS
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      - key: PLACES_DAILY_LIMIT
        value: "300"

  - type: web
    name: suraksha-setu-ai
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    # The model is a GitHub Release asset, downloaded at build time (docs/02 §9.2).
    buildCommand: pip install -r apps/ai/requirements.txt && cd apps/ai && python scripts/fetch_model.py
    startCommand: cd apps/ai && gunicorn config.wsgi -w 2 -b 0.0.0.0:$PORT --timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: suraksha-setu-ai.onrender.com
      - key: AI_INTERNAL_KEY
        fromService:
          type: web
          name: suraksha-setu-api
          envVarKey: AI_INTERNAL_KEY
      - key: MONGODB_URI_READONLY # read-only user, schemes only (runbook §1.6)
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "" # empty = provider default
      - key: LLM_TIMEOUT_S
        value: "12"
      - key: MODEL_PATH
        value: models/civic_cnn_v1.tflite
      - key: MODEL_URL # https://github.com/Ritik0712-ai/suraksha_setu/releases/download/<tag>/civic_cnn_v1.tflite
        sync: false
      - key: MODEL_CARD_URL
        sync: false
      - key: AI_ALLOWED_IMAGE_HOSTS
        value: res.cloudinary.com
