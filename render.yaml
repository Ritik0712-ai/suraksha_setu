# Render setup (docs/02 §9.2, docs/06 task 7.2) — the Node API and the Django AI service, both on
# Render's **free** plan (the project must cost nothing). Live since 27 Sep 2026 in the "Ritik"
# workspace (its own 750 free instance hours/month):
#   API https://suraksha-setu-api-jrcl.onrender.com   AI https://suraksha-setu-ai.onrender.com
# This file records that setup so it can be recreated (Render → New → Blueprint). Values marked
# `sync: false` are entered once in the dashboard and never stored in git. Steps: docs/runbook.md §2.
#
# Both services build from the repo root because they read shared/constants.json.
# Free instances sleep after 15 min without traffic; .github/workflows/keep-alive.yml keeps the API
# awake in the daytime within the free hours. Never change `plan` — paid plans are out of scope.

services:
  - type: web
    name: suraksha-setu-api
    runtime: node
    region: singapore # closest Render region to India (docs/02 §9.2)
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --workspace apps/api --include-workspace-root=false
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: HUSKY
        value: "0" # no git hooks on the build machine
      - key: BCRYPT_COST
        value: "12"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: AI_INTERNAL_KEY
        generateValue: true # the AI service reads the same value below
      - key: MONGODB_URI # Atlas prod project, read/write app user (runbook §2.1)
        sync: false
      - key: CORS_ORIGINS # https://<app>.vercel.app[,https://<custom domain>]
        sync: false
      - key: PUBLIC_APP_URL # https://<app>.vercel.app (links in SOS SMS/email)
        sync: false
      - key: AI_BASE_URL
        value: https://suraksha-setu-ai.onrender.com
      - key: CLOUDINARY_URL
        sync: false
      # Render's free plan blocks outbound SMTP ports, so emails go over HTTPS: first our free
      # Gmail relay (Google Apps Script, apps/api/mail-relay/Code.gs — no domain needed), then
      # Brevo's API if a key is set. The SMTP settings below are only a backup for other hosts.
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_FALLBACK_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_FALLBACK_PORT
        value: "587"
      - key: SMTP_FALLBACK_USER
        sync: false
      - key: SMTP_FALLBACK_PASS
        sync: false
      # Google Places needs a billing account, so it is off (0 calls); nearby services come from
      # the curated directory only.
      - key: PLACES_DAILY_LIMIT
        value: "0"

  - type: web
    name: suraksha-setu-ai
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    # The model is a GitHub Release asset, downloaded at build time (docs/02 §9.2).
    buildCommand: pip install -r apps/ai/requirements.txt && cd apps/ai && python scripts/fetch_model.py
    # 1 process × 4 threads fits the free plan's 512 MB (the classifier is guarded by a lock)
    startCommand: cd apps/ai && gunicorn config.wsgi -w 1 --threads 4 -b 0.0.0.0:$PORT --timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: AI_INTERNAL_KEY
        fromService:
          type: web
          name: suraksha-setu-api
          envVarKey: AI_INTERNAL_KEY
      - key: MONGODB_URI_READONLY # read-only user, schemes only (runbook §1.6)
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY # free Gemini key from Google AI Studio (no billing account)
        sync: false
      - key: LLM_MODEL
        value: "" # empty = provider default
      - key: LLM_TIMEOUT_S
        value: "12"
      - key: MODEL_PATH
        value: models/civic_cnn_v1.tflite
      - key: MODEL_URL # https://github.com/Ritik0712-ai/suraksha_setu/releases/download/<tag>/civic_cnn_v1.tflite
        sync: false
      - key: MODEL_CARD_URL
        sync: false
      - key: AI_ALLOWED_IMAGE_HOSTS
        value: res.cloudinary.com
