name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Web + API (lint, i18n, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # mongodb-memory-server downloads a mongod binary for the API integration tests
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test -w apps/web
      # API tests with the coverage gate (apps/api/vitest.config.js)
      - run: npm run test:coverage -w apps/api
      - run: npm run build -w apps/web
      - run: npm audit --omit=dev --audit-level=high

  ai:
    name: AI service (ruff, black, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - name: Lint the training scripts (ml/)
        run: ruff check ../../ml && black --check ../../ml
      - run: pytest -q
      # docs/02 SEC-17: known vulnerabilities in the AI service's dependencies
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  e2e:
    name: End-to-end (Playwright, 360 × 640, Hindi)
    runs-on: ubuntu-latest
    needs: [node, ai]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai/requirements*.txt
      - run: pip install -r apps/ai/requirements.txt
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
